# Loki + Promtail + Grafana (отдельно от основного стека)
#
# Сначала поднимите приложение:
#   docker compose up -d
#
# Затем observability:
#   docker compose -f docker/observability/docker-compose.yml up -d
#
# Grafana подключается к PostgreSQL основного стека через общую Docker-сеть.

name: svodki-observability

services:
  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_BIND_HOST:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    networks:
      - observability
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - observability
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    env_file:
      - ../../.env
    ports:
      - "${GRAFANA_BIND_HOST:-127.0.0.1}:${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-lokiexplore-app
    networks:
      - observability
      - app
    depends_on:
      - loki
    restart: unless-stopped

networks:
  observability:
  app:
    external: true
    name: ${SVODKI_APP_NETWORK:-v3_disk_default}

volumes:
  loki_data:
  grafana_data:
