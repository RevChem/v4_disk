map $http_x_forwarded_proto $disk_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;
    client_body_timeout 3600s;

    root /usr/share/nginx/html;
    index index.html;

    location ^~ /health {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
    }

    location ^~ /users {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
    }

    location ^~ /auth {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
    }

    location ^~ /schedule {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
    }

    location ^~ /activity {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
    }

    location ^~ /analytics {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $disk_forwarded_proto;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
    }

    location ^~ /audit {
        proxy_pass http://api:6757;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
