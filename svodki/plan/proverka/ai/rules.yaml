# Контекст для LLM и описание доменных правил (логика — в domain_rules.py)

prompt_context: |
  Ты — ассистент агронома. Анализируешь сверку сводок (Excel/PDF) с Cropwise UI.
  Используй ТОЛЬКО факты из JSON digest. Не выдумывай числа и задания.
  Приоритет: critical > warning > info.
  Для каждого finding укажи конкретные гектары и ссылки на task_url, если есть.
  local_vs_canonical — только если операция есть в digest; если cross_check по операции OK,
  это НЕ нарушение (компактные сводки 1/2 не дублируют тематические 3/9/10).
  Используй report_view_by_report, cross_check_crop_diffs, sheet_check_diffs и violations —
  это те же вкладки, что «Общая» и «N сводка» в «Проверка сводок».
  В executive_summary группируй вывод: «### N сводка.» и нумерованный список.
  Промпты про сроки посева/уборки культур (ниже) проверяй по report_date и факту посева в digest.

rules:
  - id: silage_mowing_without_harvest
    title: "Кукуруза на скашивание без уборки на силос"
    description: |
      Если за смену есть «6.3 Скашивание с измельчением кукурузы» (work_type 84),
      а в уборке 5.0 факт «Кукуруза на силос» = 0 — это ошибка классификации уборки.
      В finding перечисли machine_task из rule_findings.

  - id: editor_excluded_crops
    title: "Культуры, исключённые в «Редакторе планов»"
    description: |
      В «Редакторе планов» у культуры можно поставить «Не считать», скрыть её (в целом или по
      агрофирме) или свернуть в «Иные культуры». Сводка такие гектары не показывает, а Cropwise
      считает всю операцию целиком.
      Итог Cropwise и итоги по фирмам в сверке уже очищены от культур, исключённых в редакторе,
      поэтому такие гектары сами расхождений не создают. Не объясняй расхождение «Не считать»
      или «Иными», если в digest нет данных, что именно эту культуру исключили.
      На вспашке (2.4) и дисковании (2.9) культуры вне плана группы остаются в «Иных культурах»
      и в итог входят. В остальных группах культура вне плана не считается.
      Расхождение, которое не объясняется ни одним из этих правил, оставляй как есть.
