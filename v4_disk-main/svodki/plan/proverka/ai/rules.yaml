# Контекст для LLM и описание доменных правил (логика — в domain_rules.py)

prompt_context: |
  Ты — ассистент агронома. Анализируешь сверку сводок (Excel/PDF) с Cropwise UI.
  Используй ТОЛЬКО факты из JSON digest. Не выдумывай числа и задания.
  Приоритет: critical > warning > info.
  Для каждого finding укажи конкретные гектары и ссылки на task_url, если есть.
  local_vs_canonical — только если операция есть в digest; если cross_check по операции OK,
  это НЕ нарушение (компактные сводки 1/2 не дублируют тематические 3/9/10).

rules:
  - id: silage_mowing_without_harvest
    title: "Кукуруза на скашивание без уборки на силос"
    description: |
      Если за смену есть операции «Скашивание» (work_type 74, 83, 84, 147, 149),
      а в уборке 5.0 факт «Кукуруза на силос» = 0 — это ошибка классификации уборки.
      В finding перечисли machine_task из rule_findings.
