[project]
name = "svodki"
version = "0.2.0"
description = "Десктоп-приложение «Сводки»: отчёты Cropwise Operations в Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "pypdf>=4.0.0",
    "python-pptx>=1.0.2",
    "PyQt6>=6.4.0",
    "reportlab>=4.0.0",
    "requests>=2.28.0",
    "httpx>=0.27.0",
    "pywin32>=306; platform_system == 'Windows'",
]


